name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npm audit --omit=dev
      - run: node scripts/tool.mjs playwright install --with-deps chromium
      - name: API and browser flows
        run: |
          npm run dev > /tmp/restaurant-dev.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/health > /dev/null && curl -fsS http://127.0.0.1:5173 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:api
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
